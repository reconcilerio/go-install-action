name: CI

on:
  push:
    branches:
    - '**'
    - '!dependabot/**'
    tags:
    - '**'
  pull_request: {}

jobs:
  test:
    name: Test go-install action
    strategy: &tests
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          version: latest
        - os: ubuntu-24.04-arm
          version: latest
        # git tag
        - version: v0.20.0
        # git commit
        - version: d36047ae385302d20acd872e28f036a475fb9417
        - working-directory: hack/crane
        - version: latest
          output-path-env: CRANE
        - package: sigs.k8s.io/kind
          version: latest
          output: kind-latest
          output-dir: /usr/local/bin
          output-path-env: KIND
          cache-enabled: false
          test-args: --version
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: hack/crane/go.mod
    - name: Install package
      id: install
      uses: ./
      with: &with-install
        package: ${{ matrix.package || 'github.com/google/go-containerregistry/cmd/crane' }}
        version: ${{ matrix.version }}
        working-directory: ${{ matrix.working-directory }}
        output: ${{ matrix.output }}
        output-dir: ${{ matrix.output-dir }}
        output-path-env: ${{ matrix.output-path-env }}
        cache-enabled: ${{ matrix.cache-enabled }}
    - name: Test install
      run: ${{ steps.install.outputs.path }} ${{ matrix.test-args || 'version' }}
    - name: Test install env
      if: matrix.output-path-env
      run: ${${{ matrix.output-path-env }}} ${{ matrix.test-args || 'version' }}
  test-from-cache:
    name: Test go-install action (from cache)
    needs: test
    strategy: *tests
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: hack/crane/go.mod
    - name: Install package
      id: install
      uses: ./
      with: *with-install
    - name: Test install
      run: ${{ steps.install.outputs.path }} ${{ matrix.test-args || 'version' }}
    # test artifact provenance on the second job, as the first job seeds the cache
    - name: Test provenance
      run: |
        set -euo pipefail

        if [[ "${{ ! matrix.cache-enabled }}" == "true" && "${{ steps.install.outputs.provenance }}" != "cache" ]] ; then
          echo "::error title=Expected cache::artifact from ${{ steps.install.outputs.provenance }}"
          exit 1
        fi
        if [[ "${{ ! matrix.cache-enabled }}" == "false" && "${{ steps.install.outputs.provenance }}" != "source" ]] ; then
          echo "::error title=Expected source::artifact from ${{ steps.install.outputs.provenance }}"
          exit 1
        fi
