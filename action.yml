name: "go-install-action"
description: "Install a go package"
inputs:
  package:
    description: go package to install
    required: true
  version:
    description: version of go package to install
  os:
    description: operating system to target
  arch:
    description: architecture to target
  modfile:
    description: path to go.mod file defining the package's version
  output:
    description: name of the built binary
  output-dir:
    description: directory to place to build binary
  output-path-env:
    description: environment variable containing the output path
outputs:
  path:
    description: Path to the installed package binary
    value: ${{ steps.install.outputs.path }}

runs:
  using: "composite"
  steps:
  - name: install ${{ inputs.package }}
    id: install
    run: |
      set -euo pipefail

      package="${{ inputs.package }}"
      version="${{ inputs.version }}"
      os="${{ inputs.os }}"
      arch="${{ inputs.arch }}"
      modfile="${{ inputs.modfile }}"
      output="${{ inputs.output }}"
      output_dir="${{ inputs.output-dir }}"
      output_path_env="${{ inputs.output-path-env }}"
      
      gobin="$(go env GOBIN)"
      gopath="$(go env GOPATH)"
      goos="${os:-$(go env GOOS)}"
      goarch="${arch:-$(go env GOARCH)}"

      if [[ "${os}" != "" && "${output_dir}" == "" ]] ; then
        echo "::error title='output-dir' input required::the 'output-dir' input must be defined when 'os' input is used"
        exit 1
      fi
      if [[ "${arch}" != "" && "${output_dir}" == "" ]] ; then
        echo "::error title='output-dir' input required::the 'output-dir' input must be defined when 'arch' input is used"
        exit 1
      fi

      work_dir="${RUNNER_TEMP}/reconcilerio/go-install-action"
      mkdir -p "${work_dir}"

      cmd="GOOS=${goos} GOARCH=${goarch} go install"
      if [[ "${modfile}" != "" ]] ; then
        cmd="${cmd:+${cmd} }-modfile ${modfile}"
      fi
      cmd="${cmd:+${cmd} }${package}"
      if [[ "${version}" != "" ]] ; then
        cmd="${cmd}@${version}"
      fi

      echo "##[group]${cmd}"
        GOBIN="${work_dir}" ${cmd}
      echo "##[endgroup]"

      bin="$(find "${work_dir}" -type f)"
      if [[ "$(echo "${bin}" | wc -l)" != "1" ]] ; then
        # TODO provide a way to pick the file
        echo "::error title=extra build files found::exactly one file is expected to be built"
        echo "${bin}" | sed "s:^${work_dir}:.:"
        exit 1
      fi
      output="${output:-$(basename "${bin}")"}"
      output_dir="${output_dir:-${gobin:-${gopath}/bin}}"
      mkdir -p "${output_dir}"
      path="${output_dir}/${output}"
      mv "${work_dir}/${bin}" "${path}"

      echo "installed to: ${path}"
      echo "path=${path}" >> "${GITHUB_OUTPUT}"
      if [[ "${output_path_env}" != "" ]] ; then
        echo "${output_path_env}=${path}" >> "${GITHUB_ENV}"
      fi
      rm -rf "${work_dir}"
    shell: bash
